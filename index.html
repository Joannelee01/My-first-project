<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="따뜻한 인사와 함께 새로운 여정을 시작하는 환영 페이지"
    />
    <title>환영합니다</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="hero">
      <div class="glow glow--top" aria-hidden="true"></div>
      <div class="glow glow--bottom" aria-hidden="true"></div>

      <section class="welcome-card" aria-labelledby="welcome-title">
        <div class="icon" aria-hidden="true">
          <span>✦</span>
        </div>
        <p class="eyebrow">새로운 시작</p>
        <h1 id="welcome-title">환영합니다</h1>
        <p class="description">
          설레는 첫걸음을 함께해요.<br />지금 바로 새로운 여정을 시작해 보세요.
        </p>
        <button class="start-button" id="start-button" type="button">
          <span>시작하기</span>
          <span class="arrow" aria-hidden="true">→</span>
        </button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </section>

      <p class="footer-copy">오늘도 멋진 하루가 될 거예요.</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
